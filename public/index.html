<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rig HQ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23243'/><rect x='5' y='2' width='6' height='5' fill='%23f2c79b'/><rect x='4' y='7' width='8' height='5' fill='%2368b'/></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/css/xterm.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <section id="floor">
    <canvas id="office"></canvas>
    <div id="tip" hidden></div>
    <div id="banner" hidden></div>
    <div id="pane" hidden>
      <header><b id="pane-title"></b><span id="pane-note">view only</span><button id="pane-close" title="Close (Esc)">×</button></header>
      <div id="term"></div>
      <form id="pane-input" hidden>
        <div id="pane-keys">
          <button type="button" data-key="Up" title="Up arrow">↑</button>
          <button type="button" data-key="Down" title="Down arrow">↓</button>
          <button type="button" data-key="Left" title="Left arrow">←</button>
          <button type="button" data-key="Right" title="Right arrow">→</button>
          <button type="button" data-key="Enter">Enter</button>
          <button type="button" data-key="Escape">Esc</button>
          <button type="button" data-key="Tab">Tab</button>
          <button type="button" data-key="BTab" title="Shift+Tab">⇧Tab</button>
          <button type="button" data-key="1">1</button>
          <button type="button" data-key="2">2</button>
          <button type="button" data-key="3">3</button>
          <button type="button" data-key="4">4</button>
          <span id="pane-result" role="status"></span>
        </div>
        <div id="pane-compose">
          <textarea id="pane-text" rows="2" placeholder="Message this seat · Enter sends, Shift+Enter adds a line"></textarea>
          <button type="submit">Send</button>
        </div>
      </form>
    </div>
  </section>
  <aside>
    <header>
      <h1>Rig HQ</h1>
      <p id="status">connecting…</p>
    </header>
    <div id="legend">
      <span><i class="dot run"></i>working</span>
      <span><i class="dot idle"></i>idle</span>
      <span><i class="dot need"></i>needs you</span>
      <span><i class="env"></i>queue handoff</span>
      <span><i class="env note"></i>rig send</span>
    </div>
    <h2>Waiting for you <b id="need-count">0</b></h2>
    <ul id="needs"></ul>
    <h2>Conversations</h2>
    <ul id="log"></ul>
  </aside>
</main>
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/lib/xterm.js"></script>
<script src="app.js"></script>
</body>
</html>
